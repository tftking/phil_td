name: Nightly balance

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Co-op guardrails (solo Standard)
        run: pnpm balance --runs 200 --check --csv coop.csv
      - name: Showdown guardrails (4 players)
        run: pnpm balance --mode showdown --map vegas --players 4 --runs 300 --check --csv showdown.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-results
          path: '*.csv'
